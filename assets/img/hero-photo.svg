<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <title>Hero photo placeholder</title>
  <desc>Replace this file with your own photo. Keep the same height/width feel or update width/height attributes in index.html.</desc>
  <rect width="900" height="1100" fill="#223b38"/>
  <rect width="900" height="1100" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27423f"/>
      <stop offset="1" stop-color="#172624"/>
    </linearGradient>
  </defs>

  <!-- diagonal hair-line accent -->
  <g stroke="#997A3A" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M-60 1050 L960 240"/>
    <path d="M-20 1080 L1000 220"/>
  </g>

  <!-- thin circles -->
  <g fill="none" stroke="#997A3A" stroke-opacity="0.5" stroke-width="1.5">
    <circle cx="240" cy="270" r="130"/>
    <circle cx="700" cy="860" r="190"/>
  </g>

  <!-- abstract subject (swap for a photo of yourself / your laptop setup) -->
  <g>
    <rect x="270" y="260" width="330" height="460" rx="6" fill="#b28f46" opacity="0.5"/>
    <rect x="300" y="300" width="270" height="120" rx="4" fill="#F4F4F2" opacity="0.9"/>
    <circle cx="330" cy="380" r="34" fill="none" stroke="#1D3331" stroke-width="9"/>
    <rect x="300" y="470" width="200" height="18" fill="#F4F4F2" opacity="0.55"/>
    <rect x="300" y="510" width="250" height="18" fill="#F4F4F2" opacity="0.45"/>
    <rect x="300" y="550" width="150" height="18" fill="#F4F4F2" opacity="0.45"/>
    <rect x="300" y="640" width="160" height="44" rx="3" fill="#997A3A"/>
  </g>

  <!-- caption slot -->
  <text x="64" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4" fill="#997A3A" fill-opacity="0.7">
    YOUR PHOTO
  </text>
  <text x="64" y="1050" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.4">
    PLACEHOLDER — SEE INDEX.HTML
  </text>
</svg>