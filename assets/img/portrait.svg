<svg xmlns="http://www.w3.org/2000/svg" width="700" height="860" viewBox="0 0 700 860">
  <title>Portrait placeholder</title>
  <desc>Replace this file with your own photo. If you swap to a JPG/PNG, update the src attribute in the #about section.</desc>
  <rect width="700" height="860" fill="#223b38"/>

  <g stroke="#997A3A" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <circle cx="350" cy="420" r="250"/>
    <circle cx="640" cy="120" r="70"/>
  </g>

  <!-- abstract silhouette -->
  <g>
    <!-- shoulders -->
    <path d="M120 860 C120 620 580 620 580 860 Z" fill="#b28f46" opacity="0.55"/>
    <!-- head -->
    <circle cx="350" cy="410" r="120" fill="#F4F4F2" opacity="0.85"/>
    <circle cx="390" cy="392" r="13" fill="#1D3331" opacity="0.55"/>
    <circle cx="415" cy="392" r="13" fill="#1D3331" opacity="0.55"/>
    <path d="M368 440 Q388 452 408 440" stroke="#1D3331" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <text x="60" y="790" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4" fill="#997A3A" fill-opacity="0.7">
    PORTRAIT
  </text>
  <text x="60" y="814" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.4">
    PLACEHOLDER — SWAP IN YOUR PHOTO
  </text>
</svg>